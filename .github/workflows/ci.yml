name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: make CC=${{ matrix.cc }}
      - name: Test
        run: make CC=${{ matrix.cc }} test
      - name: AddressSanitizer + UBSan
        run: make CC=${{ matrix.cc }} asan
